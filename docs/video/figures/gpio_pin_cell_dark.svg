<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="ah-core" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5EC8E5"/></marker><marker id="ah-dec" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2C94C"/></marker><marker id="ah-imem" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4C8DFF"/></marker><marker id="ah-dmem" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CCB7F"/></marker><marker id="ah-gpio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF8A3D"/></marker><marker id="ah-uart" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B07CFF"/></marker><marker id="ah-emu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9D1E3"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93A0BD"/></marker></defs><rect width="1920" height="1080" fill="#0B1020"/><text x="70" y="88" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#E8ECF5" text-anchor="start">One GPIO pin: guide vs our design</text><text x="70" y="132" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#93A0BD" text-anchor="start">Same registers and behaviour; the tri-state buffer moves to the pad</text><rect x="50" y="180" width="880" height="700" rx="18" fill="#141B2E" stroke="#2E3A5C" stroke-width="2"/><text x="80" y="228" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#E8ECF5" text-anchor="start">Guide, Figure 1</text><text x="80" y="262" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">tri-state buffers inside the block, one inout pin</text><rect x="90" y="310" width="170" height="90" rx="8" fill="#1B2440" stroke="#FF8A3D" stroke-width="2.5"/><text x="175" y="348" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FF8A3D" text-anchor="middle">DATADIR</text><text x="175" y="380" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A0BD" text-anchor="middle">flip-flop</text><rect x="90" y="480" width="170" height="90" rx="8" fill="#1B2440" stroke="#FF8A3D" stroke-width="2.5"/><text x="175" y="518" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FF8A3D" text-anchor="middle">DATAOUT</text><text x="175" y="550" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A0BD" text-anchor="middle">flip-flop</text><rect x="90" y="700" width="170" height="90" rx="8" fill="#1B2440" stroke="#FF8A3D" stroke-width="2.5"/><text x="175" y="738" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FF8A3D" text-anchor="middle">DATAIN</text><text x="175" y="770" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A0BD" text-anchor="middle">flip-flop</text><polygon points="500,493 560,525 500,557" fill="#1B2440" stroke="#FF8A3D" stroke-width="3"/><polygon points="560,713 500,745 560,777" fill="#1B2440" stroke="#FF8A3D" stroke-width="3"/><polyline points="260,525 500,525" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round"/><polyline points="260,355 530,355 530,505" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><polyline points="530,355 620,355 620,700 530,700 530,721" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><circle cx="530" cy="720" r="7" fill="#141B2E" stroke="#FF8A3D" stroke-width="3"/><polyline points="560,525 800,525" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round"/><polyline points="700,525 700,745 565,745" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><polyline points="500,745 265,745" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><rect x="808" y="503" width="44" height="44" fill="none" stroke="#E8ECF5" stroke-width="3"/><path d="M808,503 L852,547 M852,503 L808,547" stroke="#E8ECF5" stroke-width="2"/><text x="830" y="577" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="600" fill="#93A0BD" text-anchor="middle">pins_io</text><text x="80" y="850" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">Needs a true bidirectional pin inside the design.</text><rect x="990" y="180" width="880" height="700" rx="18" fill="#141B2E" stroke="#FF8A3D" stroke-width="3"/><text x="1020" y="228" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FF8A3D" text-anchor="start">Our gpio.v</text><text x="1020" y="262" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">split bus out of the core; the pad does the tri-state</text><rect x="1030" y="310" width="170" height="90" rx="8" fill="#1B2440" stroke="#FF8A3D" stroke-width="2.5"/><text x="1115" y="348" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FF8A3D" text-anchor="middle">DATADIR</text><text x="1115" y="380" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A0BD" text-anchor="middle">flip-flop</text><rect x="1030" y="480" width="170" height="90" rx="8" fill="#1B2440" stroke="#FF8A3D" stroke-width="2.5"/><text x="1115" y="518" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FF8A3D" text-anchor="middle">DATAOUT</text><text x="1115" y="550" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A0BD" text-anchor="middle">flip-flop</text><rect x="1030" y="700" width="170" height="90" rx="8" fill="#1B2440" stroke="#FF8A3D" stroke-width="2.5"/><text x="1115" y="738" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FF8A3D" text-anchor="middle">DATAIN</text><text x="1115" y="770" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A0BD" text-anchor="middle">flip-flop</text><line x1="1420" y1="290" x2="1420" y2="820" stroke="#93A0BD" stroke-width="2" stroke-dasharray="8 8"/><text x="1410" y="305" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A0BD" text-anchor="end">core</text><text x="1430" y="305" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A0BD" text-anchor="start">pad</text><polyline points="1200,355 1570,355" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><rect x="1259" y="320" width="102" height="28" rx="6" fill="#0B1020"/><text x="1310" y="340" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#FF8A3D" text-anchor="middle">pins_oe_o</text><polyline points="1200,525 1570,525" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><rect x="1273" y="490" width="73" height="28" rx="6" fill="#0B1020"/><text x="1310" y="510" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#FF8A3D" text-anchor="middle">pins_o</text><polyline points="1570,745 1205,745" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><rect x="1273" y="710" width="73" height="28" rx="6" fill="#0B1020"/><text x="1310" y="730" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#FF8A3D" text-anchor="middle">pins_i</text><text x="1045" y="820" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A0BD" text-anchor="start">samples only when DATADIR = 0</text><rect x="1570" y="320" width="280" height="460" rx="10" fill="#1B2440" stroke="#2E3A5C" stroke-width="2" stroke-dasharray="6 6"/><text x="1710" y="500" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#E8ECF5" text-anchor="middle">pad / FPGA pin</text><text x="1710" y="545" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#93A0BD" text-anchor="middle">pin = pins_oe_o</text><text x="1710" y="575" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#93A0BD" text-anchor="middle">? pins_o : Z</text><text x="1710" y="620" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#93A0BD" text-anchor="middle">pins_i = pin</text><text x="70" y="950" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#93A0BD" text-anchor="start">Why: ChipInventor&#x27;s inout pin drops its control inputs, and FPGA fabric and Sky130 pads expect separate in / out / enable signals.</text><text x="70" y="990" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#93A0BD" text-anchor="start">Behaviour is unchanged: DATADIR bit 1 drives DATAOUT onto the pin; bit 0 releases it and DATAIN samples it.</text></svg>