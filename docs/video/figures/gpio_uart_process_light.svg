<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="ah-core" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1592B3"/></marker><marker id="ah-dec" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker><marker id="ah-imem" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FE0"/></marker><marker id="ah-dmem" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E9E5A"/></marker><marker id="ah-gpio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2650E"/></marker><marker id="ah-uart" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E44D6"/></marker><marker id="ah-emu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56627A"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56627A"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="70" y="88" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#152033" text-anchor="start">How GPIO &amp; UART drive every decision</text><text x="70" y="132" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#56627A" text-anchor="start">Everything the emulator sends enters through a peripheral; everything it checks leaves the same way</text><text x="240.0" y="185" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#56627A" text-anchor="middle">Emulator  (./emu)</text><text x="810.0" y="185" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#152033" text-anchor="middle">Peripheral hardware</text><text x="1530.0" y="185" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1592B3" text-anchor="middle">Firmware on RVBL-2  (main.s)</text><rect x="40" y="215" width="1840" height="380" rx="18" fill="#FFFFFF" stroke="#E2650E" stroke-width="2" stroke-dasharray="4 6"/><rect x="82" y="202" width="56" height="29" rx="6" fill="#FFFFFF"/><text x="110" y="223" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="600" fill="#E2650E" text-anchor="middle">GPIO</text><rect x="60" y="245" width="360" height="130" rx="12" fill="#F5F7FB" stroke="#56627A" stroke-width="2.5"/><text x="80" y="283" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#56627A" text-anchor="start">-i 0x02</text><text x="80" y="317" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">car asks to charge</text><text x="80" y="345" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">(pilot C on P2–P0)</text><rect x="60" y="430" width="360" height="130" rx="12" fill="#F5F7FB" stroke="#56627A" stroke-width="2.5"/><text x="80" y="468" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#56627A" text-anchor="start">-o 0x30</text><text x="80" y="502" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">expects contactor + lock</text><text x="80" y="530" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">on P4 and P5</text><rect x="560" y="245" width="500" height="130" rx="12" fill="#F5F7FB" stroke="#E2650E" stroke-width="2.5"/><text x="580" y="283" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#E2650E" text-anchor="start">DATAIN</text><text x="580" y="317" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">samples each pin whose DATADIR bit = 0</text><text x="580" y="345" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">(P3–P0 are inputs)</text><rect x="560" y="430" width="500" height="130" rx="12" fill="#F5F7FB" stroke="#E2650E" stroke-width="2.5"/><text x="580" y="468" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#E2650E" text-anchor="start">DATAOUT  ·  DATADIR 0xF0</text><text x="580" y="502" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">DATAOUT → pins_o,  DATADIR → pins_oe_o</text><text x="580" y="530" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">P7–P4 driven as outputs</text><rect x="1200" y="245" width="660" height="130" rx="12" fill="#F5F7FB" stroke="#1592B3" stroke-width="2.5"/><text x="1220" y="283" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#1592B3" text-anchor="start">lw  DATAIN</text><text x="1220" y="317" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">apply the pilot and E-stop rules</text><text x="1220" y="345" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">app FSM: CONNECTED → CHARGING</text><rect x="1200" y="430" width="660" height="130" rx="12" fill="#F5F7FB" stroke="#1592B3" stroke-width="2.5"/><text x="1220" y="468" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#1592B3" text-anchor="start">sw  0x30 → DATAOUT</text><text x="1220" y="502" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">one store per state change</text><text x="1220" y="530" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">0x20 lock · 0x30 charge · 0x60 hold · 0x80 fault</text><polyline points="420,310 555,310" fill="none" stroke="#E2650E" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><rect x="453" y="276" width="70" height="27" rx="6" fill="#FFFFFF"/><text x="488" y="295" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="16" font-weight="600" fill="#E2650E" text-anchor="middle">pins_i</text><polyline points="1060,310 1195,310" fill="none" stroke="#E2650E" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><rect x="1078" y="277" width="100" height="26" rx="6" fill="#FFFFFF"/><text x="1128" y="295" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#E2650E" text-anchor="middle">0xF0000004</text><polyline points="1530,375 1530,425" fill="none" stroke="#1592B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-core)"/><polyline points="1195,495 1060,495" fill="none" stroke="#E2650E" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><rect x="1078" y="462" width="100" height="26" rx="6" fill="#FFFFFF"/><text x="1128" y="480" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#E2650E" text-anchor="middle">0xF0000000</text><polyline points="555,495 420,495" fill="none" stroke="#E2650E" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><rect x="453" y="461" width="70" height="27" rx="6" fill="#FFFFFF"/><text x="488" y="480" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="16" font-weight="600" fill="#E2650E" text-anchor="middle">pins_o</text><circle cx="488" cy="333" r="17" fill="#E2650E"/><text x="488" y="340" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="1128" cy="333" r="17" fill="#E2650E"/><text x="1128" y="340" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="1560" cy="400" r="17" fill="#E2650E"/><text x="1560" y="407" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="1128" cy="518" r="17" fill="#E2650E"/><text x="1128" y="525" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><circle cx="488" cy="518" r="17" fill="#E2650E"/><text x="488" y="525" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="40" y="635" width="1840" height="380" rx="18" fill="#FFFFFF" stroke="#7E44D6" stroke-width="2" stroke-dasharray="4 6"/><rect x="82" y="622" width="56" height="29" rx="6" fill="#FFFFFF"/><text x="110" y="643" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="600" fill="#7E44D6" text-anchor="middle">UART</text><rect x="60" y="665" width="360" height="130" rx="12" fill="#F5F7FB" stroke="#56627A" stroke-width="2.5"/><text x="80" y="703" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#56627A" text-anchor="start">-t4  -t4</text><text x="80" y="737" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">one 8-byte meter frame:</text><text x="80" y="765" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">V · I · F · CRC</text><rect x="60" y="850" width="360" height="130" rx="12" fill="#F5F7FB" stroke="#56627A" stroke-width="2.5"/><text x="80" y="888" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#56627A" text-anchor="start">-r4  -r2  -r2</text><text x="80" y="922" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">reads the 8-byte</text><text x="80" y="950" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">session record</text><rect x="560" y="665" width="500" height="130" rx="12" fill="#F5F7FB" stroke="#7E44D6" stroke-width="2.5"/><text x="580" y="703" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#7E44D6" text-anchor="start">Receiver → RXDATA</text><text x="580" y="737" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">2-flop sync · one mid-bit sample</text><text x="580" y="765" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">byte done → RXDONE = 1</text><rect x="560" y="850" width="500" height="130" rx="12" fill="#F5F7FB" stroke="#7E44D6" stroke-width="2.5"/><text x="580" y="888" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#7E44D6" text-anchor="start">TXDATA → Transmitter</text><text x="580" y="922" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">TRANSMIT pulse starts the byte</text><text x="580" y="950" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">TXDONE = 1 when sent</text><rect x="1200" y="665" width="660" height="130" rx="12" fill="#F5F7FB" stroke="#1592B3" stroke-width="2.5"/><text x="1220" y="703" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#1592B3" text-anchor="start">poll RXDONE → lw RXDATA</text><text x="1220" y="737" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">crcb folds each byte into the CRC</text><text x="1220" y="765" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">8th byte: check frame · mul V × I</text><rect x="1200" y="850" width="660" height="130" rx="12" fill="#F5F7FB" stroke="#1592B3" stroke-width="2.5"/><text x="1220" y="888" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#1592B3" text-anchor="start">sw TXDATA · set TRANSMIT</text><text x="1220" y="922" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">on unplug or fault: 8-byte record</text><text x="1220" y="950" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56627A" text-anchor="start">energy · status · frames · CRC</text><polyline points="420,730 555,730" fill="none" stroke="#7E44D6" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-uart)"/><rect x="462" y="696" width="52" height="27" rx="6" fill="#FFFFFF"/><text x="488" y="715" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="16" font-weight="600" fill="#7E44D6" text-anchor="middle">rx_i</text><polyline points="1060,730 1195,730" fill="none" stroke="#7E44D6" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-uart)"/><rect x="1078" y="697" width="100" height="26" rx="6" fill="#FFFFFF"/><text x="1128" y="715" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#7E44D6" text-anchor="middle">0xF1000004</text><polyline points="1530,795 1530,845" fill="none" stroke="#1592B3" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-core)"/><polyline points="1195,915 1060,915" fill="none" stroke="#7E44D6" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-uart)"/><rect x="1078" y="882" width="100" height="26" rx="6" fill="#FFFFFF"/><text x="1128" y="900" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#7E44D6" text-anchor="middle">0xF1000000</text><polyline points="555,915 420,915" fill="none" stroke="#7E44D6" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-uart)"/><rect x="462" y="881" width="52" height="27" rx="6" fill="#FFFFFF"/><text x="488" y="900" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="16" font-weight="600" fill="#7E44D6" text-anchor="middle">tx_o</text><circle cx="488" cy="753" r="17" fill="#7E44D6"/><text x="488" y="760" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><circle cx="1128" cy="753" r="17" fill="#7E44D6"/><text x="1128" y="760" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><circle cx="1560" cy="820" r="17" fill="#7E44D6"/><text x="1560" y="827" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><circle cx="1128" cy="938" r="17" fill="#7E44D6"/><text x="1128" y="945" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><circle cx="488" cy="938" r="17" fill="#7E44D6"/><text x="488" y="945" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text><text x="70" y="1050" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#56627A" text-anchor="start">115,200 baud at 20 MHz = 174 clocks per bit, so one byte takes 1,740 cycles: the firmware checks a frame long before the next byte arrives.</text></svg>