<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="ah-core" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5EC8E5"/></marker><marker id="ah-dec" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2C94C"/></marker><marker id="ah-imem" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4C8DFF"/></marker><marker id="ah-dmem" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CCB7F"/></marker><marker id="ah-gpio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF8A3D"/></marker><marker id="ah-uart" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B07CFF"/></marker><marker id="ah-emu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9D1E3"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93A0BD"/></marker></defs><rect width="1920" height="1080" fill="#0B1020"/><text x="70" y="88" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#E8ECF5" text-anchor="start">GPIO &amp; UART integration</text><text x="70" y="132" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#93A0BD" text-anchor="start">Memory-mapped peripherals on the RVBL-2 bus, reached with ordinary lw / sw</text><rect x="60" y="190" width="330" height="740" rx="14" fill="#141B2E" stroke="#5EC8E5" stroke-width="3"/><text x="90" y="240" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5EC8E5" text-anchor="start">RVBL-2 core</text><text x="90" y="285" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#93A0BD" text-anchor="start">Multicycle, 9-state FSM</text><text x="90" y="319" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#93A0BD" text-anchor="start">RV32I + Zmmul + Xicrc</text><text x="90" y="353" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#93A0BD" text-anchor="start">20 MHz</text><rect x="85" y="560" width="280" height="250" rx="10" fill="#1B2440" stroke="#5EC8E5" stroke-width="2"/><text x="105" y="600" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E8ECF5" text-anchor="start">Load / store unit</text><text x="105" y="640" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">lw / sw drive:</text><text x="105" y="672" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">address</text><text x="105" y="704" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">we · oe · bw</text><text x="105" y="736" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">write data</text><text x="105" y="768" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">← read data</text><polyline points="365,650 515,650" fill="none" stroke="#5EC8E5" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-core)"/><rect x="401" y="613" width="79" height="27" rx="6" fill="#0B1020"/><text x="440" y="632" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="16" font-weight="600" fill="#5EC8E5" text-anchor="middle">request</text><polyline points="515,740 365,740" fill="none" stroke="#5EC8E5" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-core)"/><rect x="392" y="703" width="97" height="27" rx="6" fill="#0B1020"/><text x="440" y="722" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="16" font-weight="600" fill="#5EC8E5" text-anchor="middle">read data</text><rect x="520" y="190" width="330" height="740" rx="14" fill="#141B2E" stroke="#F2C94C" stroke-width="3"/><text x="550" y="240" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F2C94C" text-anchor="start">Address decoder</text><text x="550" y="305" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="23" font-weight="600" fill="#4C8DFF" text-anchor="start">0x0040_0000</text><text x="760" y="305" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#4C8DFF" text-anchor="start">IMEM</text><text x="550" y="357" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="23" font-weight="600" fill="#3CCB7F" text-anchor="start">0x1001_0000</text><text x="760" y="357" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#3CCB7F" text-anchor="start">DMEM</text><text x="550" y="409" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="23" font-weight="600" fill="#FF8A3D" text-anchor="start">0xF000_0000</text><text x="760" y="409" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#FF8A3D" text-anchor="start">GPIO</text><text x="550" y="461" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="23" font-weight="600" fill="#B07CFF" text-anchor="start">0xF100_0000</text><text x="760" y="461" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#B07CFF" text-anchor="start">UART</text><text x="550" y="540" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#93A0BD" text-anchor="start">Decodes the address,</text><text x="550" y="568" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#93A0BD" text-anchor="start">gates we / oe to one block,</text><text x="550" y="596" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#93A0BD" text-anchor="start">muxes its read data back.</text><text x="550" y="650" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#93A0BD" text-anchor="start">Unmapped address → reads 0</text><rect x="940" y="190" width="400" height="125" rx="14" fill="#141B2E" stroke="#4C8DFF" stroke-width="3"/><text x="964" y="232" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#4C8DFF" text-anchor="start">Instruction ROM</text><text x="964" y="270" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">firmware: 264 instructions</text><polyline points="850,252.5 935,252.5" fill="none" stroke="#4C8DFF" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-imem)"/><rect x="940" y="335" width="400" height="115" rx="14" fill="#141B2E" stroke="#3CCB7F" stroke-width="3"/><text x="964" y="377" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#3CCB7F" text-anchor="start">Data memory</text><text x="964" y="415" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">32 bytes · unused by our app</text><polyline points="850,392.5 935,392.5" fill="none" stroke="#3CCB7F" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-dmem)"/><rect x="940" y="470" width="400" height="215" rx="14" fill="#141B2E" stroke="#FF8A3D" stroke-width="3"/><text x="964" y="512" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#FF8A3D" text-anchor="start">GPIO   0xF0000000</text><text x="964" y="550" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">+0 DATAOUT  +4 DATAIN  +8 DATADIR</text><text x="964" y="582" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">8 identical pin cells</text><text x="964" y="614" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">registered reads</text><polyline points="850,577.5 935,577.5" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><rect x="940" y="715" width="400" height="215" rx="14" fill="#141B2E" stroke="#B07CFF" stroke-width="3"/><text x="964" y="757" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#B07CFF" text-anchor="start">UART   0xF1000000</text><text x="964" y="795" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">+0 TXDATA  +4 RXDATA  +8 CONTROL</text><text x="964" y="827" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">TX + RX · 115200 8N1</text><text x="964" y="859" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#93A0BD" text-anchor="start">174 clocks per bit</text><polyline points="850,822.5 935,822.5" fill="none" stroke="#B07CFF" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-uart)"/><polyline points="1585,525 1345,525" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><rect x="1405" y="495" width="121" height="28" rx="6" fill="#0B1020"/><text x="1465.0" y="515" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#FF8A3D" text-anchor="middle">pins_i[7:0]</text><polyline points="1345,580 1585,580" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><rect x="1405" y="550" width="121" height="28" rx="6" fill="#0B1020"/><text x="1465.0" y="570" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#FF8A3D" text-anchor="middle">pins_o[7:0]</text><polyline points="1345,635 1585,635" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-gpio)"/><rect x="1390" y="605" width="149" height="28" rx="6" fill="#0B1020"/><text x="1465.0" y="625" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#FF8A3D" text-anchor="middle">pins_oe_o[7:0]</text><polyline points="1585,790 1345,790" fill="none" stroke="#B07CFF" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-uart)"/><rect x="1438" y="760" width="54" height="28" rx="6" fill="#0B1020"/><text x="1465.0" y="780" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#B07CFF" text-anchor="middle">rx_i</text><polyline points="1345,860 1585,860" fill="none" stroke="#B07CFF" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-uart)"/><rect x="1438" y="830" width="54" height="28" rx="6" fill="#0B1020"/><text x="1465.0" y="850" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#B07CFF" text-anchor="middle">tx_o</text><rect x="1590" y="470" width="270" height="460" rx="14" fill="#141B2E" stroke="#C9D1E3" stroke-width="3" stroke-dasharray="10 7"/><text x="1612" y="512" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#C9D1E3" text-anchor="start">Emulator  ./emu</text><text x="1612" y="560" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#FF8A3D" text-anchor="start">GPIO  -d -i -o</text><text x="1612" y="594" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#93A0BD" text-anchor="start">P2–P0 in: pilot</text><text x="1612" y="622" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#93A0BD" text-anchor="start">P3 in: E-stop</text><text x="1612" y="650" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#93A0BD" text-anchor="start">P4–P7 out: contactor,</text><text x="1612" y="678" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#93A0BD" text-anchor="start">  lock, grid hold, fault</text><text x="1612" y="760" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#B07CFF" text-anchor="start">UART  -t -r</text><text x="1612" y="794" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#93A0BD" text-anchor="start">-t in: meter frames</text><text x="1612" y="822" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#93A0BD" text-anchor="start">-r out: session record</text><text x="70" y="990" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#93A0BD" text-anchor="start">Registered peripheral reads match the core&#x27;s MEM_ACCESS_ADDR → MEM_ACCESS_DATA load timing, so GPIO and UART joined the Stage 2 core with no FSM changes.</text><text x="70" y="1024" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#93A0BD" text-anchor="start">The core never needs a new instruction to reach the outside world: every pin and every serial byte is one lw or sw.</text></svg>